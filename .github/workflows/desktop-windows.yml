name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'windows-release' || 'windows-ci' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve Supabase publishable API key
        env:
          PUBLIC_KEY: ${{ vars.MCPOS_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -n "$PUBLIC_KEY" ]; then
            echo "SUPABASE_ANON_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice::PR builds are compile-only without a configured public API key"
          else
            echo "::error::Configure MCPOS_SUPABASE_PUBLISHABLE_KEY as a repository variable (publishable or anon key only)"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Generate Windows application icon
        run: python scripts/generate_icon.py

      - name: Build unsigned CI installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri:build

      - name: Install Azure Artifact Signing CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo install artifact-signing-cli --locked

      - name: Build signed Windows installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_ENDPOINT: ${{ vars.MCPOS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.MCPOS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.MCPOS_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_CLIENT_SECRET -or -not $env:AZURE_TENANT_ID) { throw "Release signing credentials are missing" }
          if ($env:SIGNING_ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?

      - name: Upload Windows installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.MCPOS_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          if (-not $env:EXPECTED_PUBLISHER) { throw "Expected certificate publisher is not configured" }
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -lt 2) { throw "Expected NSIS and MSI installers" }
          $app = Get-Item src-tauri/target/release/mcpos-desktop.exe
          foreach ($file in @($app) + $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Unsigned, untrusted or untimestamped release file: $($file.Name)" }
            if ($sig.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER) { throw "Unexpected publisher: $($file.Name)" }
            Write-Host "Verified: $($file.Name)"
          }

      - name: Generate installer checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: release
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/SHA256SUMS.txt
 -or $env:SIGNING_ACCOUNT -notmatch '^[a-zA-Z0-9-]+

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -lt 2) { throw "Expected NSIS and MSI installers" }
          $app = Get-Item src-tauri/target/release/mcpos-desktop.exe
          foreach ($file in @($app) + $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Unsigned, untrusted or untimestamped release file: $($file.Name)" }
            Write-Host "Verified: $($file.Name)"
          }

      - name: Generate installer checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: release
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/SHA256SUMS.txt
 -or $env:SIGNING_PROFILE -notmatch '^[a-zA-Z0-9-]+

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Windows-Installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -lt 2) { throw "Expected NSIS and MSI installers" }
          $app = Get-Item src-tauri/target/release/mcpos-desktop.exe
          foreach ($file in @($app) + $files) {
