name: Desktop Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'windows-release' || 'windows-ci' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve public API key
        env:
          PUBLIC_KEY: ${{ vars.MCPOS_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ -z "$PUBLIC_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release requires MCPOS_SUPABASE_PUBLISHABLE_KEY"
              exit 1
            fi
            echo "::notice::Compile-only build without a relay key"
          else
            node -e 'const k=process.env.PUBLIC_KEY;if(!k.startsWith("sb_publishable_")){let p;try{p=JSON.parse(Buffer.from(k.split(".")[1],"base64url").toString())}catch{};if(p?.role!=="anon")process.exit(1)}'
            echo "SUPABASE_ANON_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
          fi
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon
        run: python scripts/generate_icon.py
      - name: Test native browser navigation policy
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cargo test --manifest-path src-tauri/Cargo.toml browser_policy_tests
      - name: Build unsigned CI installers
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri:build
      - name: Install Azure Artifact Signing CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo install artifact-signing-cli --locked
      - name: Build signed Windows installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGNING_ENDPOINT: ${{ vars.MCPOS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.MCPOS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.MCPOS_SIGNING_PROFILE }}
        run: |
          if (-not $env:AZURE_CLIENT_ID -or -not $env:AZURE_CLIENT_SECRET -or -not $env:AZURE_TENANT_ID) { throw "Release signing credentials are missing" }
          if ($env:SIGNING_ENDPOINT -notmatch '^https://[a-z0-9]+\.codesigning\.azure\.net/?$' -or $env:SIGNING_ACCOUNT -notmatch '^[a-zA-Z0-9-]+$' -or $env:SIGNING_PROFILE -notmatch '^[a-zA-Z0-9-]+$') { throw "Invalid signing configuration" }
          $command = "artifact-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d McpOS %1"
          @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 -Compress | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json
          npm run tauri:build -- --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Signed build failed" }
      - name: Upload CI installers (not for distribution)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Windows-CI-Unsigned
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
      - name: Verify release signatures and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.MCPOS_SIGNING_PUBLISHER_SUBJECT }}
        run: |
          if (-not $env:EXPECTED_PUBLISHER) { throw "Expected publisher is missing" }
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw "Expected exactly one NSIS and one MSI installer" }
          $files = $nsis + $msi
          $app = Get-Item src-tauri/target/release/mcpos-desktop.exe
          foreach ($file in @($app) + $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate -or $sig.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER) { throw "Invalid signature or publisher: $($file.Name)" }
          }
          $files | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Upload verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/SHA256SUMS.txt
