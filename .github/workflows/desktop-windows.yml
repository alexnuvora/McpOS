            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "Unsigned, untrusted or untimestamped release file: $($file.Name)" }
            Write-Host "Verified: $($file.Name)"
          }

      - name: Generate installer checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Upload verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McpOS-Verified-Release
          path: release
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            release/**/*.exe
            release/**/*.msi
            release/**/SHA256SUMS.txt
) { throw "Invalid signing configuration" }
          $command = "artifact-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d McpOS %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 -Compress
          $config | Set-Content -Encoding utf8 src-tauri/tauri.release.conf.json
          npm run tauri:build -- --config src-tauri/tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Signed build failed" }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: McpOS-Windows-Installers
          path: |
