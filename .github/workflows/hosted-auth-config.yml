name: McpOS hosted auth redirect verification
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/hosted-auth-config.yml"]
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'production/gateway-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Read only nonsecret auth redirect configuration
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          config="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$PROJECT/config/auth")"
          printf '%s' "$config" | jq '{site_url, uri_allow_list, mailer_autoconfirm, external_email_enabled, disable_signup, recovery_template_default: ((.mailer_templates_recovery_content // "") == ""), recovery_template_uses_confirmation_url: ((.mailer_templates_recovery_content // "") | contains("ConfirmationURL")), recovery_template_uses_redirect_to: ((.mailer_templates_recovery_content // "") | contains("RedirectTo")), recovery_template_uses_site_url: ((.mailer_templates_recovery_content // "") | contains("SiteURL"))}'
      - name: Add only the approved McpOS auth callback destinations
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          endpoint="https://api.supabase.com/v1/projects/$PROJECT/config/auth"
          config="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "$endpoint")"
          test "$(printf '%s' "$config" | jq -r .site_url)" = "https://mcpos-dashboard.netlify.app"
          required='["https://mcpos-dashboard.netlify.app/auth/recovery","https://deploy-preview-12--mcpos-dashboard.netlify.app/auth/recovery","https://deploy-preview-12--mcpos-dashboard.netlify.app/auth/callback"]'
          patch="$(printf '%s' "$config" | jq --argjson required "$required" '{uri_allow_list: (((.uri_allow_list // "") | split(",") | map(select(length > 0))) + $required | unique | join(","))}')"
          if [ "$(printf '%s' "$config" | jq -r .uri_allow_list)" != "$(printf '%s' "$patch" | jq -r .uri_allow_list)" ]; then
            curl --fail --silent --show-error --max-time 20 -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$patch" "$endpoint" >/dev/null
          fi
          verified="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "$endpoint")"
          printf '%s' "$verified" | jq -e --argjson required "$required" '(.uri_allow_list | split(",")) as $actual | all($required[]; . as $url | $actual | index($url) != null)'
          printf '%s' "$verified" | jq '{site_url, uri_allow_list, mailer_autoconfirm}'
