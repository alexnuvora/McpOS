name: McpOS hosted quota proof
on:
  pull_request:
    branches: [main]
    paths: ["tests/hosted-quota-fixture.sql", ".github/workflows/hosted-quota-proof.yml"]
  push:
    branches: [main]
    paths: ["tests/hosted-quota-fixture.sql", ".github/workflows/hosted-quota-proof.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - name: Validate rollback fixture on isolated database
        run: |
          set -euo pipefail
          container="$(docker ps --filter name=supabase_db_ --format '{{.Names}}')"
          test -n "$container"
          test "$(printf '%s\n' "$container" | wc -l)" = 1
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/hosted-quota-fixture.sql
      - if: always()
        run: supabase stop --no-backup
  hosted-proof:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: local-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute rollback-only fixture on pinned McpOS database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "kvwwabuqydwsbhlcqxwz"
          test -n "$SUPABASE_ACCESS_TOKEN"
          body="$(jq -nc --rawfile query tests/hosted-quota-fixture.sql '{query:$query,read_only:false}')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body")"
          if [ "$status" != "201" ] && [ "$status" != "200" ]; then
            echo "::error::Hosted quota proof failed (HTTP $status). Inspect provider diagnostics; response omitted."
            exit 1
          fi
          jq -e 'type == "array"' "$response" >/dev/null
          echo "Hosted quota boundary and fixture rollback assertions passed."
