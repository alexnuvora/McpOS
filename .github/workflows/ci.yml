name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test authenticated desktop relay
        run: npm install --prefix relay --no-audit --no-fund && npm test --prefix relay
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
