name: McpOS hosted authentication launch preflight
on:
  push:
    branches: [main]
    paths: [".github/workflows/hosted-auth-launch-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read nonsecret launch readiness indicators
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          test -n "$TOKEN"
          config="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$PROJECT/config/auth")"
          required='["https://mcpos-dashboard.vercel.app/auth/callback","https://mcpos-dashboard.vercel.app/auth/recovery"]'
          checks="$(printf '%s' "$config" | jq -e --argjson required "$required" '
            ((.uri_allow_list // "") | split(",") | map(gsub("^\\s+|\\s+$";""))) as $urls |
            {
              vercel_site_url: (.site_url == "https://mcpos-dashboard.vercel.app" or .site_url == "https://mcpos-dashboard.vercel.app/"),
              vercel_redirects: all($required[]; . as $url | $urls | index($url) != null),
              email_enabled: (.external_email_enabled == true),
              email_confirmation_required: (.mailer_autoconfirm == false),
              anonymous_signin_disabled: (.external_anonymous_users_enabled == false),
              password_minimum_12: ((.password_min_length // 0) >= 12),
              turnstile_enabled: (.security_captcha_enabled == true and .security_captcha_provider == "turnstile"),
              custom_smtp_configured: (((.smtp_host // "") | length) > 0 and ((.smtp_user // "") | length) > 0 and ((.smtp_admin_email // "") | length) > 0),
              recovery_code_template: ((.mailer_templates_recovery_content // "") | contains("{{ .Token }}"))
            }')"
          printf '%s\n' "$checks"
          # Preserve the email readiness gate: built-in email is fine for the closed beta,
          # but cannot be assumed suitable for public registration or recovery.
          printf '%s' "$checks" | jq -e 'del(.custom_smtp_configured, .recovery_code_template) | all(.[]; . == true)' >/dev/null
      - name: Prove Auth rejects missing and invalid CAPTCHA tokens
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          response="$(curl --fail --silent --show-error --max-time 20 "https://api.supabase.com/v1/projects/$PROJECT/api-keys?reveal=true" -H "Authorization: Bearer $TOKEN")"
          key="$(printf '%s' "$response" | jq -er '[.[] | select(.type == "publishable" or .name == "anon") | (.api_key // .key)] | map(select(. != null and . != "")) | .[0] // empty')"
          test -n "$key"
          echo "::add-mask::$key"
          unset response
          # Password grant never sends email or creates an account. Use a unique synthetic identity.
          email="mcpos-captcha-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.org"
          for variant in missing invalid; do
            payload="$(jq -nc --arg email "$email" --arg password "$(openssl rand -hex 24)" '{email:$email,password:$password}')"
            if [ "$variant" = invalid ]; then
              payload="$(printf '%s' "$payload" | jq '. + {gotrue_meta_security:{captcha_token:"invalid-test-token"}}')"
            fi
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' -X POST "https://$PROJECT.supabase.co/auth/v1/token?grant_type=password" -H "apikey: $key" -H "Content-Type: application/json" --data "$payload")"
            code="$(jq -r '.error_code // .code // "unknown"' "$body")"
            rm -f "$body"
            if [[ "$status" =~ ^4[0-9][0-9]$ ]] && [ "$code" = captcha_failed ]; then
              echo "$variant CAPTCHA token rejected: true"
            else
              echo "::error::$variant CAPTCHA token not independently verified (HTTP $status)"
              exit 1
            fi
          done
      - name: Report public email readiness separately
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          config="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "https://api.supabase.com/v1/projects/$PROJECT/config/auth")"
          if ! printf '%s' "$config" | jq -e '((.smtp_host // "") | length) > 0 and ((.smtp_user // "") | length) > 0' >/dev/null; then
            echo "::warning::Built-in email retained for closed beta. Public email delivery and recovery remain unverified. Do not enable public registration."
          fi

