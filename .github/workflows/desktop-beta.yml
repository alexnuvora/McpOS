name: Unsigned Windows closed beta
on:
  push:
    branches: [main]
    paths: [".github/workflows/desktop-beta.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcpos-unsigned-beta
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: windows-ci
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve public API key
        env:
          # Public client configuration only; never use a secret or service-role key.
          # Fallback matches the McpOS production project's published client configuration.
          PUBLIC_KEY: ${{ vars.MCPOS_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_DdVZfRJmm-SiBTrQBL3SOg_LmvNNPy0' }}
        shell: bash
        run: |
          test -n "$PUBLIC_KEY" || (echo 'Beta release requires public relay key' && exit 1)
          node -e 'const k=process.env.PUBLIC_KEY;if(!k.startsWith("sb_publishable_")){let p;try{p=JSON.parse(Buffer.from(k.split(".")[1],"base64url").toString())}catch{};if(p?.role!=="anon")process.exit(1)}'
          echo "SUPABASE_ANON_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon
        run: python scripts/generate_icon.py
      - name: Test native browser navigation policy
        run: cargo test --manifest-path src-tauri/Cargo.toml browser_policy_tests
      - name: Build unsigned CI installers
        run: npm run tauri:build
      - name: Prepare explicitly unsigned beta assets
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -ne '0.2.5') { throw 'Unexpected beta version; review release tag' }
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected exactly one installer of each type' }
          New-Item -ItemType Directory -Force beta-release | Out-Null
          Copy-Item $nsis[0].FullName beta-release/McpOS-0.2.5-beta.1-unsigned.exe
          Copy-Item $msi[0].FullName beta-release/McpOS-0.2.5-beta.1-unsigned.msi
          Get-ChildItem beta-release | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)" } | Set-Content -Encoding ascii beta-release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: McpOS-Unsigned-Closed-Beta
          path: desktop/beta-release/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: McpOS-Unsigned-Closed-Beta
          path: release
      - name: Verify and publish prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          if gh release view v0.2.5-beta.1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement.'
            exit 1
          fi
          gh release create v0.2.5-beta.1 --target "$GITHUB_SHA" --prerelease --title "McpOS 0.2.5 closed beta (unsigned)" --notes "For authorised closed-beta testers only. These Windows installers are unsigned; Windows may block installation. Do not disable security protections. Verify SHA-256 checksums before installing. Public registration and live billing are not enabled. Installation does not grant access to an authorised workspace." McpOS-0.2.5-beta.1-unsigned.exe McpOS-0.2.5-beta.1-unsigned.msi SHA256SUMS.txt
