name: Bootstrap verified application lockfile
on:
  push:
    branches: [production/gateway-hardening]
    paths: [".github/workflows/lockfile-bootstrap.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mcpos-lockfile-bootstrap
  cancel-in-progress: false
jobs:
  restore:
    if: github.ref == 'refs/heads/production/gateway-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore lockfile from successful sandbox integration run
        uses: actions/download-artifact@v4
        with:
          name: mcpos-integration-package-lock
          run-id: 45938938055
          github-token: ${{ github.token }}
          path: restored-lock
      - name: Verify exact artifact and dependency manifest
        run: |
          echo "02673ed6eff179c3b9d2b91581b51f99d7726e7e1ffac3c21e9bbbe6d1622b0a  restored-lock/package-lock.json" | sha256sum -c -
          node -e 'const assert=require("node:assert/strict");const p=require("./package.json"),l=require("./restored-lock/package-lock.json");assert.equal(l.lockfileVersion,3);for(const field of ["name","version","dependencies","devDependencies"])assert.deepEqual(l.packages[""][field],p[field])'
          if [ -f package-lock.json ]; then
            cmp package-lock.json restored-lock/package-lock.json
          else
            cp restored-lock/package-lock.json package-lock.json
          fi
      - name: Commit only the verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Commit verified application dependency lockfile"
          git push origin HEAD:refs/heads/production/gateway-hardening
