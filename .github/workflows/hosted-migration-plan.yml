name: McpOS hosted migration plan
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/hosted-migration-plan.yml", "supabase/migrations/**"]
permissions:
  contents: read
jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'production/gateway-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Inspect linked migration plan without applying SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "kvwwabuqydwsbhlcqxwz"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase db push --help | grep -- --dry-run
          supabase link --help | grep -- --project-ref
          supabase link --project-ref "$PROJECT_REF"
          supabase migration list --linked
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
