name: McpOS hosted auth baseline hardening
on:
  push:
    branches: [main]
    paths: [".github/workflows/hosted-auth-baseline.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcpos-auth-baseline-production
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply fixed baseline and verify without logging secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT" = "kvwwabuqydwsbhlcqxwz"
          test -n "$TOKEN"
          endpoint="https://api.supabase.com/v1/projects/$PROJECT/config/auth"
          get_config() { curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $TOKEN" "$endpoint"; }
          before="$(get_config)"
          required='["https://mcpos-dashboard.vercel.app/auth/callback","https://mcpos-dashboard.vercel.app/auth/recovery"]'
          printf '%s' "$before" | jq -e --argjson required "$required" '((.uri_allow_list // "") | split(",")) as $urls | all($required[]; . as $url | $urls | index($url) != null)' >/dev/null
          template='<h2>Reset your McpOS password</h2><p>A password reset was requested for your McpOS account.</p><p><a href="{{ .ConfirmationURL }}">Reset password</a></p><p>If the link does not work, select Enter recovery code on the McpOS sign-in page and enter this one-time code:</p><p><strong>{{ .Token }}</strong></p><p>Do not share this code. If you did not request a reset, ignore this email.</p>'
          minimum="$(printf '%s' "$before" | jq -e '[12, (.password_min_length // 0)] | max')"
          payload="$(jq -nc --arg html "$template" --argjson minimum "$minimum" '{site_url:"https://mcpos-dashboard.vercel.app",password_min_length:$minimum,mailer_subjects_recovery:"Reset your McpOS password",mailer_templates_recovery_content:$html}')"
          curl --fail --silent --show-error --max-time 20 -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$payload" "$endpoint" >/dev/null
          after="$(get_config)"
          printf '%s' "$after" | jq -e --arg html "$template" --argjson required "$required" '
            ((.uri_allow_list // "") | split(",")) as $urls |
            {vercel_site_url:(.site_url == "https://mcpos-dashboard.vercel.app" or .site_url == "https://mcpos-dashboard.vercel.app/"),
             vercel_redirects:all($required[]; . as $url | $urls | index($url) != null),
             password_minimum_12:((.password_min_length // 0) >= 12),
             recovery_template_matches:(.mailer_templates_recovery_content == $html)}
            | if all(.[]; . == true) then . else error("Baseline verification failed") end'
          # Other settings, CAPTCHA and SMTP intentionally unchanged.
