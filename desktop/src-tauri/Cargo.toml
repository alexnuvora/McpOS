[package]
name = "mcpos-desktop"
version = "0.2.6"
description = "McpOS Windows desktop companion"
authors = ["McpOS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.9.10"

uiautomation = { version = "0.25.1", default-features = false, features = ["control", "input"] }
rfd = "0.15"

enigo = "0.6.1"

tiny_http = "0.12"
url = "2.5"

uuid = { version = "1", features = ["v4"] }

arboard = { version = "3", default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation","Win32_System_Threading"] }

tauri-plugin-notification = "2"

tauri-winrt-notification = "0.7.2"
